version: "3.9"

services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${PORT_DOCKER:-8080}:80"  # default 8080 jika PORT_DOCKER tidak diset
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

# Pastikan folder dist sudah ada (npm run build di luar container sekali jika belum).
# Jalankan: PORT_DOCKER=9000 docker compose up -d
# Tanpa env, default ke 8080 → http://localhost:8080
